[project]
name = "docextract-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlmodel",
  "openai",
  "docling",
  "python-multipart",
  "httpx",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["llm: needs a running LM Studio (opt-in)"]
